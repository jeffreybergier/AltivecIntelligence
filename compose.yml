# SDK archives: project ./.altivec-sdk first, then host ~/.altivec-sdk.
# Before building, create BOTH context directories (either may be empty):
#   mkdir -p .altivec-sdk ~/.altivec-sdk
# Place these exact files in either folder:
#   MacOSX10.5.sdk.tar.xz
#   MacOSX11.3.sdk.tar.xz
#   iPhoneOS8.4.sdk.tar.gz
# Verify from this project root: bin/altivec-sdk preflight
# ALTIVEC_SDK_HOST_DIR selects one existing host folder for both sources.
# Runtime mounts create missing host folders; BuildKit contexts must exist.
services:
  altivec:
    build:
      context: .
      dockerfile: Containerfile
      target: ghcr-action
      additional_contexts:
        altivec_sdk: ${ALTIVEC_SDK_HOST_DIR:-./.altivec-sdk}
        altivec_sdk_shared: ${ALTIVEC_SDK_HOST_DIR:-${HOME}/.altivec-sdk}
    image: ${ALTIVEC_IMAGE:-altivec-intelligence:local}
    working_dir: /repo/altivec
    volumes:
      - cache:/cache
      - ~/.altivec:/root
      - .:/repo/altivec
      - ${ALTIVEC_SDK_HOST_DIR:-./.altivec-sdk}:/altivec-sdk:ro
      - ${ALTIVEC_SDK_HOST_DIR:-${HOME}/.altivec-sdk}:/altivec-sdk-shared:ro
      - altivec-sdk-legacy:/osxcross/legacy/target/SDK
      - altivec-sdk-modern:/osxcross/modern/SDK
      # Uncomment to add more tools into the container
      # ../extras:/repo/extras
      
  altivec-intelligence:
    build:
      context: .
      dockerfile: Containerfile
      target: ghcr-action
      additional_contexts:
        altivec_sdk: ${ALTIVEC_SDK_HOST_DIR:-./.altivec-sdk}
        altivec_sdk_shared: ${ALTIVEC_SDK_HOST_DIR:-${HOME}/.altivec-sdk}
    image: ${ALTIVEC_IMAGE:-altivec-intelligence:local}
    stdin_open: true
    tty: true
    environment:
      - IS_SANDBOX=1
      - TERM=xterm-256color
      - COLORTERM=${COLORTERM:-}
    working_dir: /repo/altivec
    volumes:
      - cache:/cache
      - ~/.altivec:/root
      - .:/repo/altivec
      - ${ALTIVEC_SDK_HOST_DIR:-./.altivec-sdk}:/altivec-sdk:ro
      - ${ALTIVEC_SDK_HOST_DIR:-${HOME}/.altivec-sdk}:/altivec-sdk-shared:ro
      - altivec-sdk-legacy:/osxcross/legacy/target/SDK
      - altivec-sdk-modern:/osxcross/modern/SDK
      # Uncomment to add more tools into the container
      # ../extras:/repo/extras
    entrypoint: /bin/bash
    command: -lc "altivec-chooser"

volumes:
  cache:
  altivec-sdk-legacy:
  altivec-sdk-modern:
