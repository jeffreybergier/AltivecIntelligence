# SDK archives: container home first, then the current project.
# Before building, create BOTH context directories (either may be empty):
#   mkdir -p ~/.altivec/.altivec-sdk .altivec-sdk
# Place these exact files in either folder:
#   MacOSX10.5.sdk.tar.xz
#   MacOSX11.3.sdk.tar.xz
#   iPhoneOS8.4.sdk.tar.gz
# Container preflight: docker compose run --rm altivec "altivec-sdk preflight"
# Runtime mounts create missing host folders; BuildKit contexts must exist.
services:
  altivec:
    build:
      context: .
      dockerfile: Containerfile
      target: ghcr-action
      additional_contexts:
        altivec_sdk: ./.altivec-sdk
        altivec_sdk_shared: ${HOME}/.altivec/.altivec-sdk
    image: ${ALTIVEC_IMAGE:-altivec-intelligence:local}
    working_dir: /repo/altivec
    volumes:
      - cache:/cache
      - ~/.altivec:/root
      - .:/repo/altivec
      - altivec-sdk-legacy:/osxcross/legacy/target/SDK
      - altivec-sdk-modern:/osxcross/modern/SDK
      # Uncomment to add more tools into the container
      # ../extras:/repo/extras
      
  altivec-intelligence:
    build:
      context: .
      dockerfile: Containerfile
      target: ghcr-action
      additional_contexts:
        altivec_sdk: ./.altivec-sdk
        altivec_sdk_shared: ${HOME}/.altivec/.altivec-sdk
    image: ${ALTIVEC_IMAGE:-altivec-intelligence:local}
    stdin_open: true
    tty: true
    environment:
      - IS_SANDBOX=1
      - TERM=xterm-256color
      - COLORTERM=${COLORTERM:-}
    working_dir: /repo/altivec
    volumes:
      - cache:/cache
      - ~/.altivec:/root
      - .:/repo/altivec
      - altivec-sdk-legacy:/osxcross/legacy/target/SDK
      - altivec-sdk-modern:/osxcross/modern/SDK
      # Uncomment to add more tools into the container
      # ../extras:/repo/extras
    entrypoint: /bin/bash
    command: -lc "altivec-chooser"

volumes:
  cache:
  altivec-sdk-legacy:
  altivec-sdk-modern:
