# Before building this development image, create ./.altivec-sdk and place these
# exact files in it:
#   MacOSX10.5.sdk.tar.xz
#   MacOSX11.3.sdk.tar.xz
#   iPhoneOS8.4.sdk.tar.gz
# Then verify them with:
#   ALTIVEC_SDK_CATALOG="$PWD/share/altivec-sdk/catalog.json" \
#   ALTIVEC_SDK_ARCHIVE_DIR="$PWD/.altivec-sdk" bin/altivec-sdk preflight
services:
  altivec:
    build:
      context: .
      dockerfile: Containerfile
      target: ghcr-action
      additional_contexts:
        altivec_sdk: ${ALTIVEC_SDK_HOST_DIR:-./.altivec-sdk}
    image: altivec-image
    working_dir: /repo/altivec
    environment:
      ALTIVEC_SDK_ARCHIVE_DIR: /altivec-sdk
    volumes:
      - cache:/cache
      - ~/.altivec:/root
      - .:/repo/altivec
      - ${ALTIVEC_SDK_HOST_DIR:-./.altivec-sdk}:/altivec-sdk:ro
      - altivec-sdk-legacy:/osxcross/legacy/target/SDK
      - altivec-sdk-modern:/osxcross/modern/SDK
      # Uncomment to add more tools into the container
      # ../extras:/repo/extras
      
  altivec-intelligence:
    build:
      context: .
      dockerfile: Containerfile
      target: ghcr-action
      additional_contexts:
        altivec_sdk: ${ALTIVEC_SDK_HOST_DIR:-./.altivec-sdk}
    image: altivec-intelligence-image
    stdin_open: true
    tty: true
    environment:
      - IS_SANDBOX=1
      - TERM=xterm-256color
      - COLORTERM=${COLORTERM:-}
      - ALTIVEC_SDK_ARCHIVE_DIR=/altivec-sdk
    working_dir: /repo/altivec
    volumes:
      - cache:/cache
      - ~/.altivec:/root
      - .:/repo/altivec
      - ${ALTIVEC_SDK_HOST_DIR:-./.altivec-sdk}:/altivec-sdk:ro
      - altivec-sdk-legacy:/osxcross/legacy/target/SDK
      - altivec-sdk-modern:/osxcross/modern/SDK
      # Uncomment to add more tools into the container
      # ../extras:/repo/extras
    entrypoint: /bin/bash
    command: -lc "altivec-chooser"

volumes:
  cache:
  altivec-sdk-legacy:
  altivec-sdk-modern:
