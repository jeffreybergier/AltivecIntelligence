name: Build Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: altivec-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/altivec-intelligence

jobs:
  prepare:
    name: Resolve immutable release inputs
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_sha: ${{ steps.release.outputs.release_sha }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve tag and commit
        id: release
        run: |
          set -euo pipefail
          git fetch --force origin \
            main:refs/remotes/origin/main

          if [[ "$GITHUB_REF_TYPE" != tag ]]; then
            echo "Unsupported ref type: ${GITHUB_REF_TYPE}" >&2
            exit 1
          fi
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+([.][0-9]+){0,2}$ ]]; then
            echo "Release tag must be v followed by a numeric version: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          tag_sha="$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")"
          event_sha="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if [[ "$tag_sha" != "$event_sha" ]]; then
            echo "Event SHA ${event_sha} does not match tag SHA ${tag_sha}." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$event_sha" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} (${event_sha}) is not reachable from origin/main." >&2
            exit 1
          fi

          echo "release_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_sha=${event_sha}" >> "$GITHUB_OUTPUT"

      - name: Audit repository history for Apple build inputs
        env:
          ALTIVEC_SDK_CATALOG: ${{ github.workspace }}/share/altivec-sdk/catalog.json
        run: bin/altivec-sdk audit-repository "$GITHUB_WORKSPACE"

  build_image:
    name: Build GHCR image (${{ matrix.platform }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash

    steps:
      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Check out exact release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Fetch verified SDK build inputs
        uses: ./.github/actions/fetch-sdk
        with:
          macos_105_url: ${{ secrets.ALTIVEC_SDK_MACOS_105_URL }}
          macos_113_url: ${{ secrets.ALTIVEC_SDK_MACOS_113_URL }}
          iphoneos_84_url: ${{ secrets.ALTIVEC_SDK_IPHONEOS_84_URL }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          target: ghcr-action
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-contexts: |
            altivec_sdk=${{ runner.temp }}/.altivec-sdk
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=min,scope=${{ env.PLATFORM_PAIR }}

      - name: Audit every image layer for Apple SDK content
        env:
          ALTIVEC_SDK_CATALOG: ${{ github.workspace }}/share/altivec-sdk/catalog.json
          ALTIVEC_SDK_ARCHIVE_DIR: ${{ runner.temp }}/.altivec-sdk
        run: |
          set -euo pipefail
          image_ref="${IMAGE}@${{ steps.build.outputs.digest }}"
          docker pull "$image_ref"
          bin/altivec-sdk audit-image "$image_ref"

      - name: Export digest
        run: |
          set -euo pipefail
          digest="${{ steps.build.outputs.digest }}"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Build returned an invalid digest: ${digest}" >&2
            exit 1
          fi
          mkdir -p /tmp/digests
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: release-digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  merge_image:
    name: Assemble exact GHCR candidate
    needs:
      - prepare
      - build_image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      build_image: ${{ steps.candidate.outputs.build_image }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: release-digests-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create candidate manifest list
        id: candidate
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          mapfile -t digests < <(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          if [[ "${#digests[@]}" -ne 2 ]]; then
            echo "Expected two platform digests, found ${#digests[@]}." >&2
            exit 1
          fi

          sources=()
          for digest in "${digests[@]}"; do
            if [[ ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Invalid platform digest: ${digest}" >&2
              exit 1
            fi
            sources+=("${IMAGE}@sha256:${digest}")
          done

          candidate_tag="${IMAGE}:candidate-${RELEASE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker buildx imagetools create \
            -t "$candidate_tag" \
            --metadata-file /tmp/candidate-metadata.json \
            "${sources[@]}"

          manifest_digest="$(
            jq -r '."containerimage.descriptor".digest // empty' \
              /tmp/candidate-metadata.json
          )"
          if [[ ! "$manifest_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid candidate manifest digest: ${manifest_digest}" >&2
            cat /tmp/candidate-metadata.json >&2
            exit 1
          fi
          echo "build_image=${IMAGE}@${manifest_digest}" >> "$GITHUB_OUTPUT"

      - name: Inspect candidate image
        run: docker buildx imagetools inspect "${{ steps.candidate.outputs.build_image }}"

  release_extras:
    name: Build release extras from candidate image
    needs:
      - prepare
      - merge_image
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/release-extras.yml
    with:
      build_image: ${{ needs.merge_image.outputs.build_image }}
      release_tag: ${{ needs.prepare.outputs.release_tag }}
      release_sha: ${{ needs.prepare.outputs.release_sha }}
    secrets:
      ALTIVEC_SDK_MACOS_105_URL: ${{ secrets.ALTIVEC_SDK_MACOS_105_URL }}
      ALTIVEC_SDK_MACOS_113_URL: ${{ secrets.ALTIVEC_SDK_MACOS_113_URL }}
      ALTIVEC_SDK_IPHONEOS_84_URL: ${{ secrets.ALTIVEC_SDK_IPHONEOS_84_URL }}

  publish:
    name: Publish image and release assets
    needs:
      - prepare
      - merge_image
      - release_extras
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      packages: write
    env:
      BUILD_IMAGE: ${{ needs.merge_image.outputs.build_image }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
      RELEASE_VERSION: ${{ needs.release_extras.outputs.release_version }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out exact release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          fetch-depth: 0

      - name: Download completed release assets
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: release-assets-*
          merge-multiple: true

      - name: Verify assets and generate checksums
        run: .github/scripts/prepare-release-assets.sh dist "$RELEASE_VERSION"

      - name: Confirm the remote tag is unchanged
        run: |
          set -euo pipefail
          git fetch --no-tags --force origin \
            "refs/tags/${RELEASE_TAG}:refs/ci/remote-release-tag"
          remote_sha="$(git rev-parse 'refs/ci/remote-release-tag^{commit}')"
          if [[ "$remote_sha" != "$RELEASE_SHA" ]]; then
            echo "Remote tag moved from ${RELEASE_SHA} to ${remote_sha}." >&2
            exit 1
          fi

      - name: Stage draft GitHub release
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          .github/scripts/publish-release.sh stage \
            "$RELEASE_TAG" "$RELEASE_SHA" dist

      - name: Log in to GHCR
        if: steps.release_state.outputs.is_draft == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        if: steps.release_state.outputs.is_draft == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Promote verified image
        if: steps.release_state.outputs.is_draft == 'true'
        run: |
          set -euo pipefail
          git fetch --no-tags --force origin \
            "refs/tags/${RELEASE_TAG}:refs/ci/remote-release-tag"
          remote_sha="$(git rev-parse 'refs/ci/remote-release-tag^{commit}')"
          if [[ "$remote_sha" != "$RELEASE_SHA" ]]; then
            echo "Remote tag moved from ${RELEASE_SHA} to ${remote_sha}." >&2
            exit 1
          fi
          docker buildx imagetools create \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${RELEASE_TAG}" \
            -t "${IMAGE}:${RELEASE_SHA}" \
            "$BUILD_IMAGE"
          docker buildx imagetools inspect "${IMAGE}:${RELEASE_TAG}"

      - name: Publish GitHub release
        if: steps.release_state.outputs.is_draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags --force origin \
            "refs/tags/${RELEASE_TAG}:refs/ci/remote-release-tag"
          remote_sha="$(git rev-parse 'refs/ci/remote-release-tag^{commit}')"
          if [[ "$remote_sha" != "$RELEASE_SHA" ]]; then
            echo "Remote tag moved from ${RELEASE_SHA} to ${remote_sha}." >&2
            exit 1
          fi
          .github/scripts/publish-release.sh publish \
            "$RELEASE_TAG" "$RELEASE_SHA" dist
